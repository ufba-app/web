name: Docs

# Site de documentação (docs.ufba.app). Estático: o conteúdo é baixado do memory em tempo de build.
# Roda em push na main que toque apps/docs ou packages/, a cada 6 horas (o conteúdo muda no memory, não no git)
# e na mão. Falhou em qualquer passo (memory fora do ar, projeto vazio, segredo achado): nada é publicado e o
# GitHub Pages continua servindo a última versão boa.
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento termina antes do próximo começar.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O site usa @ufba-app/tokens (cores e fontes); o dist dele é o que o CSS importa.
      - run: pnpm --filter @ufba-app/tokens build

      # Único passo com a chave do memory (somente leitura). Baixa só as páginas com a tag `public`, falha se o
      # projeto estiver vazio ou fora do ar e roda a varredura de segredos interna antes de gravar qualquer arquivo.
      - name: Baixar o conteúdo do memory
        env:
          MEMORY_DOCS_KEY: ${{ secrets.MEMORY_DOCS_KEY }}
        run: pnpm --filter @ufba-app/docs content

      # Segunda varredura, independente da interna, sobre o que foi baixado. Binário fixo e conferido pelo checksum
      # publicado junto com a versão.
      - name: Varredura de segredos (gitleaks)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2==f {print $1"  gitleaks.tar.gz"}' checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir apps/docs/src/content/docs --no-banner --redact --exit-code 1

      # Sem a chave no ambiente: o build do site não tem como colocá-la no HTML.
      - name: Gerar o site
        run: pnpm --filter @ufba-app/docs build:site

      - name: Conferir o site gerado
        run: pnpm --filter @ufba-app/docs check:dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
